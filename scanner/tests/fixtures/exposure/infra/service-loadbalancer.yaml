apiVersion: v1
kind: Service
metadata:
  name: public-gateway
  namespace: production
  labels:
    app: public-gateway
    tier: frontend
spec:
  type: LoadBalancer
  selector:
    app: public-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: https
      port: 443
      targetPort: 3443
