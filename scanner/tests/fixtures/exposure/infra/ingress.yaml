apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-gateway-ingress
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-gateway
                port:
                  number: 80
