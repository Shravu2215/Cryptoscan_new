name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend-core/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  integrity-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrity-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: integrity-service/package-lock.json
      - run: npm ci
      - run: npm test

  blockchain-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: blockchain-module/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test test/CryptoAnchor.test.js test/ipfs.test.js

  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  cbom-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cbom-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cbom-service/package-lock.json
      - run: npm ci
      - run: npm test
